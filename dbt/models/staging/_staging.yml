version: 2

models:
  - name: stg_uci__clients
    columns:
      - name: client_id
        data_tests: [unique, not_null]
      - name: credit_limit
        data_tests: [not_null]
      - name: status_sep
        data_tests:
          - accepted_values:
              arguments: {values: [-2, -1, 0, 1, 2, 3, 4, 5, 6, 7, 8], quote: false}
